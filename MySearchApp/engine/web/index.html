<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Search</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#202124;background:#fff}.wrap{max-width:1100px;margin:auto;padding:18px 22px}.brand{font-size:30px;font-weight:600;text-align:center;margin:48px 0 20px}.brand span{font-weight:400}.sub{font-size:13px;color:#70757a;margin-top:8px}.searchbox{position:relative;max-width:800px;margin:auto}form{display:flex;border:1px solid #dfe1e5;border-radius:28px;padding:4px 7px 4px 18px;box-shadow:0 2px 8px #00000018}input{flex:1;border:0;outline:0;font-size:18px;padding:10px;background:transparent}button{border:0;border-radius:22px;padding:0 20px;cursor:pointer}.suggest{position:absolute;left:0;right:0;top:58px;background:white;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 14px #0002;z-index:5;overflow:hidden}.suggest div{padding:10px 16px;cursor:pointer}.suggest div:hover{background:#f1f3f4}.tabs{display:flex;gap:8px;justify-content:center;margin:24px auto 18px;flex-wrap:wrap}.tab{padding:9px 18px;border:1px solid #dadce0;background:#fff;border-radius:20px;color:#3c4043}.tab.active{background:#1a73e8;color:#fff;border-color:#1a73e8}.meta{color:#70757a;font-size:14px;margin:18px 0 10px}.notice{font-size:13px;color:#8a5a00;background:#fff8e1;border:1px solid #f0d98c;padding:9px 12px;border-radius:8px;margin:10px 0 18px}.result{padding:13px 0 22px;max-width:900px;border-bottom:1px solid #f2f2f2}.result a.title{font-size:20px;color:#1a0dab;text-decoration:none}.url{font-size:13px;color:#188038;margin:4px 0 7px;word-break:break-all}.snip{font-size:15px;line-height:1.5;color:#4d5156}.thumb{float:right;width:120px;height:86px;object-fit:cover;border-radius:8px;margin-left:14px}.badge{display:inline-block;font-size:11px;border:1px solid #ddd;border-radius:12px;padding:2px 8px;margin-left:7px;color:#666;vertical-align:2px}.engine{font-size:11px;color:#888;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 3px #0001}.card img{width:100%;height:155px;object-fit:cover;background:#f5f5f5}.cardbody{padding:10px}.card a{color:#1a0dab;text-decoration:none;font-weight:600;line-height:1.3}.small{font-size:12px;color:#70757a;margin-top:6px;line-height:1.35}.videoThumb{position:relative}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000b;color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}.pages{display:flex;gap:6px;justify-content:center;margin:30px 0 60px}.pages button{padding:8px 12px;border:1px solid #ddd;background:#fff}.pages button:disabled{background:#f1f3f4;cursor:default}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.brand{margin-top:25px}.grid{grid-template-columns:1fr 1fr}.card img{height:120px}.result a.title{font-size:18px}.thumb{width:85px;height:62px}}
</style></head><body><div class="wrap">
<div class="brand">My <span>Search</span><div class="sub">Your local index + broad web search powered by SearXNG</div></div>
<div class="searchbox"><form id="form"><input id="q" placeholder="Search the web and my index..." autocomplete="off"><button>Search</button></form><div id="suggest" class="suggest" hidden></div></div>
<div class="tabs"><button class="tab active" data-tab="all">All</button><button class="tab" data-tab="images">Images</button><button class="tab" data-tab="news">News</button><button class="tab" data-tab="videos">Videos</button></div>
<div id="meta"></div><div id="notice"></div><div id="results"></div><div id="pages" class="pages"></div></div>
<script>
const q=document.getElementById('q'),form=document.getElementById('form'),sug=document.getElementById('suggest');let timer,currentPage=1,currentTab='all';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(q.value.trim())search(1)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
q.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(async()=>{let v=q.value.trim();if(!v){sug.hidden=true;return}try{let d=await(await fetch('/api/suggest?q='+encodeURIComponent(v))).json();sug.innerHTML=d.suggestions.map(x=>'<div>'+esc(x)+'</div>').join('');sug.hidden=!d.suggestions.length;[...sug.children].forEach(el=>el.onclick=()=>{q.value=el.textContent;sug.hidden=true;search(1)})}catch(e){}},180)});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))sug.hidden=true});form.onsubmit=e=>{e.preventDefault();sug.hidden=true;search(1)};
function renderPages(page,totalPages){let p=document.getElementById('pages');p.innerHTML='';if(totalPages<=1)return;if(page>1)p.innerHTML+='<button onclick="search('+(page-1)+')">Previous</button>';let start=Math.max(1,page-2),end=Math.min(totalPages,page+2);for(let i=start;i<=end;i++)p.innerHTML+=`<button onclick="search(${i})" ${i==page?'disabled':''}>${i}</button>`;if(page<totalPages)p.innerHTML+='<button onclick="search('+(page+1)+')">Next</button>'}
function imageCard(h){return `<div class="card"><a href="${esc(h.url)}" target="_blank" rel="noopener"><img src="${esc(h.image||'')}" loading="lazy" onerror="this.style.display='none'"></a><div class="cardbody"><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a><div class="small">${esc(h.engine||'SearXNG')}</div></div></div>`}
function newsCard(h){return `<div class="result">${h.image?`<img class="thumb" src="${esc(h.image)}" loading="lazy" onerror="this.remove()">`:''}<a class="title" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a><div class="url">${esc(h.url)}</div><div class="snip">${esc(h.snippet||h.description||'')}</div><div class="engine">${esc(h.publishedDate||h.published_date||'')} ${h.author?' · '+esc(h.author):''} · via ${esc(h.engine||'SearXNG')}</div></div>`}
function videoCard(h){return `<div class="card"><div class="videoThumb"><a href="${esc(h.url)}" target="_blank" rel="noopener">${h.image?`<img src="${esc(h.image)}" loading="lazy" onerror="this.style.display='none'">`:''}<span class="play">▶</span></a></div><div class="cardbody"><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a><div class="small">${esc(h.duration||h.length||'')} · ${esc(h.engine||'SearXNG')}</div></div></div>`}
async function search(page){let term=q.value.trim();if(!term)return;currentPage=page;document.getElementById('results').innerHTML='<p>Searching...</p>';document.getElementById('pages').innerHTML='';document.getElementById('notice').innerHTML='';
try{if(currentTab==='all'){let d=await(await fetch('/api/search?q='+encodeURIComponent(term)+'&page='+page+'&per_page=10')).json();document.getElementById('meta').textContent=(d.total||d.hits.length)+' combined results';if(d.webAvailable===false)document.getElementById('notice').textContent='Web search is temporarily unavailable. Showing your local index only.';document.getElementById('results').innerHTML=d.hits.map(h=>`<div class="result">${h.image?`<img class="thumb" src="${esc(h.image)}" onerror="this.remove()">`:''}<a class="title" href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a><span class="badge">${h.source==='local'?'LOCAL INDEX':'WEB'}</span><div class="url">${esc(h.url)}</div><div class="snip">${esc(h.snippet||h.description||'')}</div>${h.engine&&h.source==='web'?`<div class="engine">via ${esc(h.engine)}</div>`:''}</div>`).join('')||'<p>No results found.</p>';renderPages(page,d.totalPages||1)}else{let d=await(await fetch('/api/media?q='+encodeURIComponent(term)+'&category='+currentTab+'&page='+page+'&per_page=24')).json();document.getElementById('meta').textContent=(d.total||d.hits.length)+' '+currentTab+' results';if(d.webAvailable===false)document.getElementById('notice').textContent='This media category is temporarily unavailable.';if(currentTab==='images'||currentTab==='videos'){document.getElementById('results').className='grid';document.getElementById('results').innerHTML=d.hits.map(currentTab==='images'?imageCard:videoCard).join('')||'<p>No results found.</p>'}else{document.getElementById('results').className='';document.getElementById('results').innerHTML=d.hits.map(newsCard).join('')||'<p>No results found.</p>'}renderPages(page,1)}}catch(e){document.getElementById('results').className='';document.getElementById('results').innerHTML='<p>Search services are still starting. Try again in a few seconds.</p>'}}
</script></body></html>
